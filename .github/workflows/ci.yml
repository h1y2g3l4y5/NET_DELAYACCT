# CI workflow for NET_DELAYACCT
# This is the canonical CI file. GitHub Actions reads from .github/workflows/.
name: net-delayacct-ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  KERNEL_TAG: linux-6.6.y
  LINUX_SRC: ${{ github.workspace }}/linux-6.6

jobs:
  checkpatch:
    name: checkpatch on kernel patches
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libelf-dev libssl-dev \
            bison flex libncurses-dev libmnl-dev ccache perl

      - name: Checkout linux-stable (shallow, with retry)
        run: |
          for i in 1 2 3 4 5; do
            git clone --depth 1 --branch "$KERNEL_TAG" \
              https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
              "$LINUX_SRC" && break
            echo "Clone attempt $i failed, retrying in $((i*10))s..."
            rm -rf "$LINUX_SRC"
            sleep $((i*10))
          done
          test -d "$LINUX_SRC/.git"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ~/.cache/ccache
          key: ccache-checkpatch-${{ runner.os }}-${{ env.KERNEL_TAG }}

      - name: Run checkpatch.pl on patches
        run: |
          set -e
          cp_dir="$LINUX_SRC/scripts"
          fail=0
          shopt -s nullglob
          patches=(kernel-patches/*.patch)
          if [ "${#patches[@]}" -eq 0 ]; then
            echo "No patches found in kernel-patches/, skipping."
            exit 0
          fi
          for p in "${patches[@]}"; do
            echo "::group::checkpatch $p"
            if ! perl "$cp_dir/checkpatch.pl" --no-tree --strict "$p"; then
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "$fail"

  build-kernel:
    name: Build kernel (${{ matrix.mode }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        mode: [on, off]
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libelf-dev libssl-dev \
            bison flex libncurses-dev libmnl-dev ccache bc

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ~/.cache/ccache
          key: ccache-kernel-${{ runner.os }}-${{ env.KERNEL_TAG }}-v2

      - name: Checkout linux-stable (shallow, with retry)
        run: |
          for i in 1 2 3 4 5; do
            git clone --depth 1 --branch "$KERNEL_TAG" \
              https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
              "$LINUX_SRC" && break
            echo "Clone attempt $i failed, retrying in $((i*10))s..."
            rm -rf "$LINUX_SRC"
            sleep $((i*10))
          done
          test -d "$LINUX_SRC/.git"

      - name: Apply kernel patches
        run: |
          set -e
          cd "$LINUX_SRC"
          shopt -s nullglob
          patches=("$GITHUB_WORKSPACE"/kernel-patches/*.patch)
          if [ "${#patches[@]}" -eq 0 ]; then
            echo "No patches to apply."
            exit 0
          fi

          # Fix xxx placeholder line numbers using actual kernel source
          for p in "${patches[@]}"; do
            if ! grep -q 'xxx' "$p" 2>/dev/null; then
              continue
            fi
            echo "Fixing placeholder line numbers in $(basename "$p")"
            if [[ "$p" == *"Kconfig"* ]]; then
              LINE=$(grep -n "config NET_RX_BUSY_POLL" net/Kconfig | head -1 | cut -d: -f1)
              START=$((LINE - 8))
              sed -i "s|@@ -xxx,6 +xxx,23 @@|@@ -${START},6 +${START},23 @@|" "$p"
              echo "  Kconfig: NET_RX_BUSY_POLL at line $LINE, hunk start=$START"
            elif [[ "$p" == *"Makefile"* ]]; then
              LINE=$(grep -n "CONFIG_FAILOVER" net/core/Makefile | head -1 | cut -d: -f1)
              START=$((LINE - 3))
              sed -i "s|@@ -xxx,6 +xxx,7 @@|@@ -${START},6 +${START},7 @@|" "$p"
              echo "  Makefile: FAILOVER at line $LINE, hunk start=$START"
            fi
          done

          for p in "${patches[@]}"; do
            echo "Applying $p"
            git apply "$p" || patch -p1 < "$p"
          done

      - name: Configure kernel with fragment
        run: |
          cd "$LINUX_SRC"
          make defconfig
          if [ "${{ matrix.mode }}" = "on" ]; then
            # ON: 合并 NET_DELAYACCT core config + QEMU boot config
            #   - ci/kernel.config.fragment: NET_DELAYACCT core config
            #   - ci/qemu/kernel-qemu.config: QEMU boot + ftrace (Test 23) + netem (Test 23 S7)
            scripts/kconfig/merge_config.sh -m .config \
              "$GITHUB_WORKSPACE/ci/kernel.config.fragment" \
              "$GITHUB_WORKSPACE/ci/qemu/kernel-qemu.config"
          else
            # OFF: 仅 QEMU boot config（ftrace/netem 仍需，功能测试 S1-S25 不受 NET_DELAYACCT 开关影响）
            # 显式关闭 NET_DELAYACCT，用于 perf-test 双内核对比的 OFF 基线
            scripts/kconfig/merge_config.sh -m .config \
              "$GITHUB_WORKSPACE/ci/qemu/kernel-qemu.config"
            sed -i 's/CONFIG_NET_DELAYACCT=y/# CONFIG_NET_DELAYACCT is not set/' .config
          fi
          make olddefconfig
          grep -E 'CONFIG_(NET|NET_DELAYACCT|FTRACE|FUNCTION_TRACER|NET_SCH_NETEM)=' .config || true

      - name: Build kernel
        run: |
          cd "$LINUX_SRC"
          make -j"$(nproc)" CC="ccache gcc" bzImage modules

      - name: Upload bzImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: bzImage-${{ matrix.mode }}
          path: ${{ env.LINUX_SRC }}/arch/x86/boot/bzImage
          retention-days: 1

  build-tool:
    name: Build userspace get_sockdelays
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libmnl-dev ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ~/.cache/ccache
          key: ccache-tool-${{ runner.os }}

      - name: Install UAPI header
        run: |
          sudo install -m 0644 -D \
            kernel-patches/include-uapi-linux-net-delayacct.h \
            /usr/include/linux/net-delayacct.h

      - name: Build tool
        run: make tool CC="ccache gcc"

      - name: Smoke test binary
        run: |
          test -x userspace/get_sockdelays/get_sockdelays
          ./userspace/get_sockdelays/get_sockdelays -h || true

      - name: Build test helpers (path coverage + io_uring send)
        run: |
          make -C tests/helper CC="ccache gcc" || echo "helper build failed, path tests will SKIP"
          test -x tests/helper/delayacct_path_test && echo "path helper OK" || echo "path helper MISSING"
          test -x tests/helper/delayacct_io_uring_send && echo "io_uring helper OK" || echo "io_uring helper MISSING"

      - name: Upload get_sockdelays artifact
        uses: actions/upload-artifact@v4
        with:
          name: get_sockdelays
          path: userspace/get_sockdelays/get_sockdelays
          retention-days: 1

      - name: Upload test helper artifact
        uses: actions/upload-artifact@v4
        with:
          name: delayacct_path_test
          path: tests/helper/delayacct_path_test
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload io_uring helper artifact
        uses: actions/upload-artifact@v4
        with:
          name: delayacct_io_uring_send
          path: tests/helper/delayacct_io_uring_send
          retention-days: 1
          if-no-files-found: ignore

  qemu-test:
    name: QEMU runtime test (KVM)
    runs-on: ubuntu-22.04
    needs: [build-kernel, build-tool]
    if: github.event_name == 'push'
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 iperf3 busybox-static ncat cpio iproute2 iptables

      - name: Setup KVM acceleration
        run: |
          echo "=== QEMU acceleration detection ==="
          ls -la /dev/kvm 2>/dev/null && echo "  /dev/kvm: exists" || echo "  /dev/kvm: not found"
          grep -Ec 'vmx|svm' /proc/cpuinfo 2>/dev/null && echo "  CPU: hardware virtualization supported" || echo "  CPU: no vmx/svm (nested virt disabled)"

      - name: Download bzImage artifact (ON kernel)
        uses: actions/download-artifact@v4
        with:
          name: bzImage-on
          path: /tmp/artifacts

      - name: Download get_sockdelays artifact
        uses: actions/download-artifact@v4
        with:
          name: get_sockdelays
          path: /tmp/artifacts

      - name: Download test helper artifact
        uses: actions/download-artifact@v4
        with:
          name: delayacct_path_test
          path: /tmp/artifacts

      - name: Download io_uring helper artifact
        uses: actions/download-artifact@v4
        with:
          name: delayacct_io_uring_send
          path: /tmp/artifacts

      - name: Build initramfs and run QEMU (KVM)
        run: |
          set -e
          # ERR trap: emit a visible ::error:: annotation (shown in the run's
          # annotation list) identifying the failing command + line number, so
          # root cause is diagnosable without downloading the full log.
          trap 'echo "::error::Initramfs/QEMU step failed at line $LINENO (exit $?) — command: $BASH_COMMAND"' ERR
          cd "$GITHUB_WORKSPACE"
          mkdir -p /tmp/initrd/{bin,sbin,usr/local/bin,etc,proc,sys,dev,tmp,root,lib/x86_64-linux-gnu,lib64}

          # Verify artifacts
          test -f /tmp/artifacts/bzImage || { echo "ERROR: bzImage not found"; exit 1; }
          test -f /tmp/artifacts/get_sockdelays || { echo "ERROR: get_sockdelays not found"; exit 1; }

          # Copy busybox + create applet symlinks
          cp "$(which busybox)" /tmp/initrd/bin/busybox
          for applet in sh ls cat cp mount umount sleep kill echo grep date head tail \
            awk sed test mknod mkdir chmod readlink true false ifconfig ip timeout nc \
            nslookup wget tee sort wc uname dmesg sync reboot poweroff halt \
            modprobe mountpoint strings seq basename dirname tr cut mktemp rm; do
            ln -sf /bin/busybox "/tmp/initrd/bin/$applet"
          done

          # Copy bash (test scripts use bash syntax)
          if [ -f /bin/bash ]; then
            cp /bin/bash /tmp/initrd/bin/bash
            chmod +x /tmp/initrd/bin/bash
            for lib in $(ldd /bin/bash 2>/dev/null | grep -o '/[^ ]*' || true); do
              mkdir -p "/tmp/initrd/$(dirname "$lib")"
              cp "$lib" "/tmp/initrd$lib" 2>/dev/null || true
            done
          fi

          # Copy get_sockdelays
          cp /tmp/artifacts/get_sockdelays /tmp/initrd/usr/local/bin/
          chmod +x /tmp/initrd/usr/local/bin/get_sockdelays

          # Copy test helpers (path coverage, io_uring send)
          # 静态链接；缺失时相关测试自动 SKIP
          if [ -f /tmp/artifacts/delayacct_path_test ]; then
            cp /tmp/artifacts/delayacct_path_test /tmp/initrd/usr/local/bin/
            chmod +x /tmp/initrd/usr/local/bin/delayacct_path_test
            echo "Copied delayacct_path_test helper"
          else
            echo "WARNING: delayacct_path_test not found, path tests will SKIP"
          fi
          if [ -f /tmp/artifacts/delayacct_io_uring_send ]; then
            cp /tmp/artifacts/delayacct_io_uring_send /tmp/initrd/usr/local/bin/
            chmod +x /tmp/initrd/usr/local/bin/delayacct_io_uring_send
            echo "Copied delayacct_io_uring_send helper"
          else
            echo "WARNING: delayacct_io_uring_send not found, io_uring test will SKIP"
          fi

          # Copy unified test script
          mkdir -p /tmp/initrd/opt
          cp ci/qemu/run-tests.sh /tmp/initrd/opt/run-tests.sh
          chmod +x /tmp/initrd/opt/run-tests.sh

          # Copy guest-init.sh as init
          cp ci/qemu/guest-init.sh /tmp/initrd/init
          chmod +x /tmp/initrd/init

          # Copy iperf3 + nc + their shared libs
          for bin in iperf3 nc; do
            b=$(which "$bin") || { echo "WARNING: $bin not found, skipping"; continue; }
            rm -f "/tmp/initrd/bin/$bin"
            cp "$b" "/tmp/initrd/bin/$bin"
            for lib in $(ldd "$b" 2>/dev/null | grep -o '/[^ ]*' || true); do
              mkdir -p "/tmp/initrd/$(dirname "$lib")"
              cp "$lib" "/tmp/initrd$lib" 2>/dev/null || true
            done
          done

          # Copy tc + iptables + their shared libs (for Test 23 S7: retransmission via netem/iptables)
          # tc 需要 netem qdisc 支持 (CONFIG_NET_SCH_NETEM)，iptables 需要 xtables (CONFIG_NETFILTER_XTABLES)
          for bin in tc iptables; do
            b=$(which "$bin" 2>/dev/null) || { echo "WARNING: $bin not found, S7 will SKIP"; continue; }
            rm -f "/tmp/initrd/sbin/$bin" "/tmp/initrd/usr/sbin/$bin"
            # Defensive copy: a failure here must not abort the whole CI step
            # (it would only cause S7 to SKIP in the guest). Log + continue.
            if ! cp "$b" "/tmp/initrd/sbin/$bin" 2>/dev/null; then
              echo "WARNING: failed to copy $bin ($b), S7 will SKIP"
              continue
            fi
            chmod +x "/tmp/initrd/sbin/$bin" 2>/dev/null || true
            for lib in $(ldd "$b" 2>/dev/null | grep -o '/[^ ]*' || true); do
              mkdir -p "/tmp/initrd/$(dirname "$lib")"
              cp "$lib" "/tmp/initrd$lib" 2>/dev/null || true
            done
            # tc 还依赖 netem qdisc 共享对象 (/usr/lib/x86_64-linux-gnu/tc/q_netem.so)
            if [ "$bin" = "tc" ]; then
              for qso in /usr/lib/x86_64-linux-gnu/tc/q_netem.so /usr/lib/x86_64-linux-gnu/tc/*.so; do
                [ -f "$qso" ] || continue
                mkdir -p "/tmp/initrd/usr/lib/x86_64-linux-gnu/tc"
                cp "$qso" "/tmp/initrd/usr/lib/x86_64-linux-gnu/tc/" 2>/dev/null || true
              done
            fi
            echo "Packed $bin with shared libs"
          done

          # Copy get_sockdelays shared libs + dynamic linker
          for lib in $(ldd /tmp/artifacts/get_sockdelays 2>/dev/null | grep -o '/[^ ]*' || true); do
            mkdir -p "/tmp/initrd/$(dirname "$lib")"
            cp "$lib" "/tmp/initrd$lib" 2>/dev/null || true
          done
          if [ -f /lib64/ld-linux-x86-64.so.2 ]; then
            cp /lib64/ld-linux-x86-64.so.2 /tmp/initrd/lib64/
          fi

          # Build initramfs
          cd /tmp/initrd
          find . | cpio -o -H newc | gzip -9 > /tmp/initrd.img
          cd "$GITHUB_WORKSPACE"

          echo "Initramfs built: $(du -sh /tmp/initrd.img | cut -f1)"

          # Run QEMU — try KVM first, retry with TCG if KVM init fails.
          # /dev/kvm may exist as a device node even when the kernel module
          # isn't loaded, so we detect the real failure by grepping QEMU stderr.
          echo "::group::QEMU boot log"

          echo "QEMU attempt 1: kvm (timeout=300s)"
          timeout 300 qemu-system-x86_64 \
            -machine q35,accel=kvm -m 1024M -smp 2 \
            -kernel /tmp/artifacts/bzImage \
            -initrd /tmp/initrd.img \
            -append "console=ttyS0,115200n8 init=/init" \
            -nographic -no-reboot 2>&1 | tee /tmp/qemu.log || true

          if grep -qE 'Could not access KVM|failed to initialize kvm' /tmp/qemu.log 2>/dev/null; then
            echo ""
            echo "KVM unavailable — retrying with TCG (timeout=600s)..."
            timeout 600 qemu-system-x86_64 \
              -machine q35,accel=tcg -m 1024M -smp 2 \
              -kernel /tmp/artifacts/bzImage \
              -initrd /tmp/initrd.img \
              -append "console=ttyS0,115200n8 init=/init" \
              -nographic -no-reboot 2>&1 | tee /tmp/qemu.log || true
          fi

          echo "::endgroup::"

          # Extract structured test results from QEMU log
          echo ""
          echo "========== TEST RESULTS SUMMARY =========="
          grep -A6 "NET_DELAYACCT Test Results" /tmp/qemu.log || echo "(no results box found)"
          echo ""
          grep -E '\[PASS\]|\[FAIL\]|\[SKIP\]' /tmp/qemu.log || echo "(no pass/fail lines found)"
          echo "==========================================="

          echo ""
          echo "=== QEMU boot tail (last 30 lines) ==="
          tail -30 /tmp/qemu.log 2>/dev/null || echo "(qemu.log empty or missing)"

          # Exit with failure if any FAIL found, or if NO tests ran at all.
          # Use `grep -Ec ... || true` + `${VAR:-0}` instead of `grep -c ... || echo 0`:
          # the latter produces "0\n0" when there are no matches (grep -c prints "0"
          # AND exits 1, then echo prints another "0"), which breaks the integer
          # comparisons below. Anchor with `^\s*\[PASS\]` to exclude scenario
          # status lines like `    [S1 PASS]` (which contain `[PASS]` as a substring
          # and would inflate the count).
          PASS_N=$(grep -Ec '^\s*\[PASS\]' /tmp/qemu.log 2>/dev/null || true); PASS_N=${PASS_N:-0}
          FAIL_N=$(grep -Ec '^\s*\[FAIL\]' /tmp/qemu.log 2>/dev/null || true); FAIL_N=${FAIL_N:-0}
          SKIP_N=$(grep -Ec '^\s*\[SKIP\]' /tmp/qemu.log 2>/dev/null || true); SKIP_N=${SKIP_N:-0}
          echo "Test counts: PASS=$PASS_N FAIL=$FAIL_N SKIP=$SKIP_N"

          if [ "$FAIL_N" -gt 0 ]; then
            # Surface the failing test lines directly in a ::error:: annotation
            # so the root cause is visible in the run's annotation list without
            # downloading the full log.
            FAIL_LINES=$(grep -E '^\s*\[FAIL\]' /tmp/qemu.log 2>/dev/null | head -10 | tr '\n' '|' | sed 's/|$//')
            echo "::error::Tests FAILED (${PASS_N}P/${FAIL_N}F/${SKIP_N}S). Failing: ${FAIL_LINES}"
            exit 1
          fi

          if [ "$PASS_N" -eq 0 ] && [ "$FAIL_N" -eq 0 ] && [ "$SKIP_N" -eq 0 ]; then
            echo "::error::No tests executed — QEMU likely failed to boot (see QEMU log tail above)"
            exit 1
          fi

      - name: Upload QEMU log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-log
          path: /tmp/qemu.log
          retention-days: 7

      - name: Generate CI summary
        if: always()
        run: |
          {
            echo "## NET_DELAYACCT Test Results"
            echo ""
            echo "### Test Suite Output (last 1000 lines)"
            echo '```'
            tail -1000 /tmp/qemu.log 2>/dev/null || true
            echo '```'
            echo ""
            PASS=$(grep -E '^\s*\[PASS\]' /tmp/qemu.log 2>/dev/null | wc -l || true)
            FAIL=$(grep -E '^\s*\[FAIL\]' /tmp/qemu.log 2>/dev/null | wc -l || true)
            SKIP=$(grep -E '^\s*\[SKIP\]' /tmp/qemu.log 2>/dev/null | wc -l || true)
            echo "**Result: ${PASS} PASS, ${FAIL} FAIL, ${SKIP} SKIP**"
            echo ""
            # 提取 Test 23 场景状态汇总行（TASK-37: 不打开 artifact 也能看到 S7/S8 状态）
            echo "### Test 23 Scenario Status"
            echo '```'
            grep -E '场景通过率|S[1-8]=' /tmp/qemu.log 2>/dev/null || echo "(Test 23 not run or no scenario summary)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -1000 /tmp/qemu.log > /tmp/test-summary.txt 2>/dev/null || true
          echo "Step summary updated"

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: /tmp/test-summary.txt
          retention-days: 30

  perf-test:
    name: Performance test (KVM, K0 vs K2 vs K3)
    # self-hosted runner（本地 VM，有 KVM 加速）
    # 注册 runner 时需加 linux + kvm 标签：./config.sh --labels linux,kvm
    # 前置条件：VM 需安装 qemu-system-x86, iperf3, busybox-static, ncat, cpio, iproute2, libmnl0
    runs-on: [self-hosted, linux, kvm]
    needs: [build-kernel, build-tool]
    if: github.event_name == 'push'
    # timeout-minutes=60: self-hosted KVM 下单次 QEMU ~280s，三次 ~920s + setup < 20min
    #   保留 60min 上限兼容 TCG 回退（KVM 不可用时 3 × 900s + setup ~2780s）
    timeout-minutes: 60
    # 性能回归不阻塞功能合并（v6.5.0 议题5 共识）：
    # perf-test 用于趋势监控，非功能正确性门禁。
    # --strict=warn 下 FAIL → exit 0（告警），仅 NO-DATA/INVALID>50% → exit 2（job 失败）。
    # continue-on-error: exit 2 时 workflow 仍 success，CI 界面显示 ⚠️
    continue-on-error: true
    env:
      # CI 专用 QEMU timeout（每次 QEMU 运行的上限，K0/K2/K3 各一次）：
      # KVM 360s: 内核 boot ~10s + perf 测试 ~280s（含 idle 15s + 6项测试×3轮×13s）
      # TCG 900s: TCG 回退（无 KVM 时），-smp 2 下 boot ~120s + 测试 ~420s + 余量
      QEMU_TIMEOUT_KVM: 360
      QEMU_TIMEOUT_TCG: 900
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libmnl0: get_sockdelays 运行时依赖，ldd 需要它才能解析并拷贝 libmnl.so.0 到 initramfs
          sudo apt-get install -y qemu-system-x86 iperf3 busybox-static ncat cpio iproute2 libmnl0

      - name: Download bzImage-on
        uses: actions/download-artifact@v4
        with:
          name: bzImage-on
          # 分目录下载：upload 时 path=.../bzImage，下载后文件名为 bzImage
          # ON/OFF 分目录避免同名文件冲突
          path: /tmp/artifacts/on

      - name: Download bzImage-off
        uses: actions/download-artifact@v4
        with:
          name: bzImage-off
          path: /tmp/artifacts/off

      - name: Download get_sockdelays artifact
        uses: actions/download-artifact@v4
        with:
          name: get_sockdelays
          path: /tmp/artifacts

      - name: Place get_sockdelays binary
        run: |
          # perf-test.sh 期望二进制位于 userspace/get_sockdelays/get_sockdelays
          mkdir -p userspace/get_sockdelays
          cp /tmp/artifacts/get_sockdelays userspace/get_sockdelays/get_sockdelays
          chmod +x userspace/get_sockdelays/get_sockdelays
          echo "get_sockdelays placed: $(file userspace/get_sockdelays/get_sockdelays)"

      - name: Run perf-test (KVM, --strict=warn, --with-k3)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -f /tmp/artifacts/on/bzImage || { echo "ERROR: bzImage-on not found"; exit 1; }
          test -f /tmp/artifacts/off/bzImage || { echo "ERROR: bzImage-off not found"; exit 1; }
          test -x userspace/get_sockdelays/get_sockdelays || { echo "ERROR: get_sockdelays not found"; exit 1; }
          echo "=== KVM availability ==="
          ls -la /dev/kvm 2>/dev/null && echo "  /dev/kvm: exists" || echo "  /dev/kvm: not found (will fallback to TCG)"
          echo ""
          # K0=OFF内核(基线), K2=ON内核(检测开启,无查询), K3=ON内核+主动查询
          # --with-k3: 启用 K3 模式（需 get_sockdelays 已就位）
          # --strict=warn: FAIL/INVALID 均为告警（exit 0），不阻断；
          #   仅 NO-DATA（全 SKIP）或 INVALID>50%（数据不可信）才 exit 2。
          # --test-duration=10: CI 用较短时长（本地可设 60s 做完整验证）
          # --warmup=3: iperf3 --omit 3 跳过 slow-start
          # exit code: 0=PASS/warn通过, 2=数据不可信(NO-DATA/INVALID>50%)
          #   continue-on-error 保证 exit 2 也不阻断 workflow
          ./perf-test.sh --skip-build --with-k3 --strict=warn \
            --bzimage-on=/tmp/artifacts/on/bzImage \
            --bzimage-off=/tmp/artifacts/off/bzImage \
            --test-duration=10 --warmup=3

      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: |
            tests/reports/perf/perf-test-*.log
            tests/reports/perf/perf-summary-*.md
            tests/reports/perf/perf-summary-*.csv
            tests/reports/perf/perf-K0-*.log
            tests/reports/perf/perf-K2-*.log
            tests/reports/perf/perf-K3-*.log
          retention-days: 30

      - name: Generate perf summary
        if: always()
        run: |
          # 优先展示 Markdown 摘要，fallback 到 log verdict 摘要
          PERF_MD=$(ls -t tests/reports/perf/perf-summary-*.md 2>/dev/null | head -1)
          if [ -n "$PERF_MD" ] && [ -f "$PERF_MD" ]; then
            cat "$PERF_MD" >> "$GITHUB_STEP_SUMMARY"
          else
            PERF_LOG=$(ls -t tests/reports/perf/perf-test-*.log 2>/dev/null | head -1)
            if [ -n "$PERF_LOG" ]; then
              {
                echo "## Performance Test Results (K0 vs K2 vs K3)"
                echo ""
                echo "### Verdict Summary"
                echo '```'
                sed -n '/Verdict:/,/===.*===/p' "$PERF_LOG" | head -20
                echo '```'
                echo ""
                echo "Full log: download perf-report artifact"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "## Performance Test: no log found" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          # 诊断段：把每个模式的 PERF 行数 + QEMU rc 写进 Summary，
          # 全 SKIP / NO-DATA 时无需翻原始日志即可定位（rc=124=TCG 超时 / 0 行=guest 未启动）
          PERF_LOG=$(ls -t tests/reports/perf/perf-test-*.log 2>/dev/null | head -1)
          if [ -n "$PERF_LOG" ] && [ -f "$PERF_LOG" ]; then
            {
              echo ""
              echo "### QEMU Run Diagnostics"
              echo ""
              echo "| Mode | PERF lines | QEMU rc | Note |"
              echo "|------|-----------|---------|------|"
              for mode in K0 K2 K3; do
                # K3 log 可能不存在（get_sockdelays 缺失或构建失败时降级），加 || true 避免 set -e 中断 summary
                mode_log=$(ls -t tests/reports/perf/perf-${mode}-*.log 2>/dev/null | head -1 || true)
                [ -z "$mode_log" ] && { echo "| ${mode} | - | - | 未运行 |"; continue; }
                n=$(grep -c "^PERF:" "$mode_log" 2>/dev/null || true)
                [ -z "$n" ] && n=0
                rc=$(grep -oE "QEMU exited \(rc=[0-9]+\)" "$mode_log" 2>/dev/null | head -1 | grep -oE "[0-9]+" || echo "?")
                note=""
                [ "$rc" = "124" ] && note="TCG/KVM 超时"
                [ "$n" = "0" ] && note="${note:+$note; }guest 未产出 PERF 行（启动/panic/超时）"
                echo "| ${mode} | ${n} | ${rc} | ${note:--} |"
              done
              echo ""
              echo "> K3 显示 \"-\" 表示 get_sockdelays 未就位或 QEMU 未产出数据"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
